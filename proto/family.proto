syntax = "proto3";

package family;

option go_package = "proto/family;family";

message NodeInfo {
  string host = 1;
  int32 port = 2;
}

message FamilyView {
  repeated NodeInfo members = 1;
}

message Empty {}

message StoredMessage {
  int32 id = 1;
  string text = 2;
}

message StoreResult {
  bool success = 1;
  string error = 2;
}

message MessageId {
  int32 id = 1;
}

service FamilyService {
  // cluster
  rpc Join(NodeInfo) returns (FamilyView);
  rpc GetFamily(Empty) returns (FamilyView);

  // storage
  rpc Store(StoredMessage) returns (StoreResult);
  rpc Retrieve(MessageId) returns (StoredMessage);
}
